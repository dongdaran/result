[build-system]
requires = ["setuptools>=75,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "harmbench-steering"
version = "0.1.0"
description = "Level-wise representation steering experiments with reusable HarmBench splits"
requires-python = ">=3.11,<3.13"
dependencies = []

[project.optional-dependencies]
gpu = [
  "torch==2.14.1",
  "transformers==4.57.6",
  "accelerate>=1.2,<2",
  "safetensors>=0.5,<1",
]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
hb-steering = "hb_steering.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

# A full commit SHA is required for GPU runs.
# ./scripts/pin-models resolves the configured HF IDs to commit SHAs.
# Qwen: 민정, 승민.
[tool.hb-steering.models.model_1]
hf_id = "Qwen/Qwen2.5-7B-Instruct"
revision = "a09a35458c702b33eeacc393d103063234e8bc28"
dtype = "auto"

# Llama: 재민, 도윤. Exact version/size/checkpoint remains to be selected.
[tool.hb-steering.models.model_2]
hf_id = ""
revision = ""
dtype = "auto"

# Gemma: 세진, 한비. Exact version/size/checkpoint remains to be selected.
[tool.hb-steering.models.model_3]
hf_id = ""
revision = ""
dtype = "auto"
