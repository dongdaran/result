[build-system]
requires = ["setuptools>=75,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "harmbench-steering"
version = "0.1.0"
description = "Level-wise representation steering experiments with reusable HarmBench splits"
requires-python = ">=3.11,<3.13"
dependencies = []

[project.optional-dependencies]
gpu = [
  "torch>=2.6,<3",
  "transformers>=4.57,<5",
  "accelerate>=1.2,<2",
  "safetensors>=0.5,<1",
]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
hb-steering = "hb_steering.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
